<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>경남산업 재고관리</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#16181d;--muted:#747b86;--line:#e5e7eb;--accent:#111827;--danger:#d92d20;--warn:#b54708;--ok:#067647;--blue:#175cd3}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:24px 16px}.brand{font-size:20px;font-weight:800;margin:4px 8px 28px}.brand small{display:block;font-size:12px;font-weight:500;color:#9ca3af;margin-top:4px}.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;padding:12px 14px;text-align:left;border-radius:10px;font-size:15px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}
.main{padding:28px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.title h1{font-size:26px;margin:0 0 6px}.title p{margin:0;color:var(--muted);font-size:14px}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.btn.primary{background:#111827;color:#fff;border-color:#111827}.btn.danger{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.stat .label{font-size:13px;color:var(--muted)}.stat .num{font-size:28px;font-weight:800;margin-top:10px}.stat .sub{font-size:12px;color:var(--muted);margin-top:7px}
.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.section-title{font-size:17px;font-weight:800;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);font-weight:700}td.num{text-align:right;font-variant-numeric:tabular-nums}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.pill.low{background:#fef3f2;color:var(--danger)}.pill.ok{background:#ecfdf3;color:var(--ok)}
.product-row{cursor:pointer}.product-row:hover{background:#fafafa}.muted{color:var(--muted)}.hidden{display:none!important}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.field.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(640px,100%);background:#fff;border-radius:18px;padding:22px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 18px}.sizes{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.size-box{border:1px solid var(--line);border-radius:10px;padding:8px}.size-box span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.size-box input{width:100%;border:0;font-weight:700;outline:0}
.view{display:none}.view.active{display:block}.size-table{overflow-x:auto}.size-table table{min-width:780px}.size-stock{font-weight:800}.recent-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.recent-item:last-child{border-bottom:0}.recent-item strong{font-size:14px}.recent-item small{display:block;color:var(--muted);margin-top:4px}.in{color:var(--ok);font-weight:800}.out{color:var(--danger);font-weight:800}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{padding:12px;position:sticky;top:0;z-index:5}.brand{margin:0 8px 10px;font-size:17px}.brand small{display:none}.nav{display:flex;overflow-x:auto}.nav button{min-width:max-content;padding:9px 11px}.main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.top .btn{width:100%}.sizes{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.card{padding:14px}.stat .num{font-size:23px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.sizes{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">경남산업 <small>안전화 재고관리</small></div>
    <div class="nav">
      <button class="active" data-view="dashboard">대시보드</button>
      <button data-view="products">제품·재고</button>
      <button data-view="movement">입고·출고</button>
      <button data-view="history">입출고 내역</button>
    </div>
  </aside>
  <main class="main">
    <section id="dashboard" class="view active">
      <div class="top"><div class="title"><h1>재고 대시보드</h1><p>모델과 사이즈별 재고를 한눈에 확인합니다.</p></div><button class="btn primary" onclick="openProductModal()">+ 제품 등록</button></div>
      <div class="stats">
        <div class="card stat"><div class="label">총 재고</div><div id="totalStock" class="num">0</div><div class="sub">전체 사이즈 합계</div></div>
        <div class="card stat"><div class="label">등록 제품</div><div id="productCount" class="num">0</div><div class="sub">모델 기준</div></div>
        <div class="card stat"><div class="label">부족 재고</div><div id="lowCount" class="num">0</div><div class="sub">기준 10족 이하</div></div>
        <div class="card stat"><div class="label">오늘 입·출고</div><div id="todayMove" class="num">0</div><div class="sub">처리 건수</div></div>
      </div>
      <div class="grid">
        <div class="card"><h3 class="section-title">제품별 재고 <button class="btn" onclick="showView('products')">전체보기</button></h3><div id="dashboardProducts"></div></div>
        <div class="card"><h3 class="section-title">최근 입출고</h3><div id="recentMoves"></div></div>
      </div>
    </section>

    <section id="products" class="view">
      <div class="top"><div class="title"><h1>제품·재고</h1><p>제품을 선택하면 사이즈별 재고를 확인할 수 있습니다.</p></div><button class="btn primary" onclick="openProductModal()">+ 제품 등록</button></div>
      <div class="card"><input id="productSearch" class="search" placeholder="모델명 또는 제품명 검색" oninput="renderProducts()"/><div id="productList"></div></div>
      <div id="productDetail" class="card hidden" style="margin-top:16px"></div>
    </section>

    <section id="movement" class="view">
      <div class="top"><div class="title"><h1>입고·출고 등록</h1><p>처리 즉시 현재 재고에 반영됩니다.</p></div></div>
      <div class="card" style="max-width:720px">
        <div class="form-grid">
          <div class="field"><label>구분</label><select id="moveType"><option value="in">입고</option><option value="out">출고</option></select></div>
          <div class="field"><label>제품</label><select id="moveProduct" onchange="renderMoveSizes()"></select></div>
          <div class="field"><label>사이즈</label><select id="moveSize"></select></div>
          <div class="field"><label>수량</label><input id="moveQty" type="number" min="1" value="1"/></div>
          <div class="field full"><label>거래처 / 메모</label><input id="moveMemo" placeholder="예: ○○건설 납품 / 생산 입고"/></div>
        </div>
        <div class="actions"><button class="btn primary" onclick="submitMovement()">재고 반영</button></div>
      </div>
    </section>

    <section id="history" class="view">
      <div class="top"><div class="title"><h1>입출고 내역</h1><p>최근 처리된 재고 변동 기록입니다.</p></div><button class="btn" onclick="exportCSV()">CSV 다운로드</button></div>
      <div class="card"><div id="historyList"></div></div>
    </section>
  </main>
</div>

<div id="productModal" class="modal-wrap hidden">
  <div class="modal">
    <h2>제품 등록</h2>
    <div class="form-grid">
      <div class="field"><label>모델명</label><input id="pModel" placeholder="예: AW-600D"/></div>
      <div class="field"><label>제품명</label><input id="pName" placeholder="예: 6인치 다이얼 안전화"/></div>
      <div class="field"><label>색상</label><input id="pColor" placeholder="예: BLACK"/></div>
      <div class="field"><label>부족재고 기준</label><input id="pLow" type="number" min="0" value="10"/></div>
      <div class="field full"><label>사이즈별 초기 재고</label><div id="sizeInputs" class="sizes"></div></div>
    </div>
    <div class="actions"><button class="btn" onclick="closeProductModal()">취소</button><button class="btn primary" onclick="saveProduct()">등록</button></div>
  </div>
</div>
<script>
const SIZES=[230,235,240,245,250,255,260,265,270,275,280,285,290];
const STORE='gn_inventory_v1', MOVES='gn_inventory_moves_v1';
let products=JSON.parse(localStorage.getItem(STORE)||'null')||[
 {id:crypto.randomUUID(),model:'AW-600D',name:'다이얼 안전화',color:'BLACK',low:10,stocks:{230:8,235:12,240:18,245:20,250:23,255:31,260:42,265:58,270:45,275:19,280:7,285:5,290:3}},
 {id:crypto.randomUUID(),model:'AW-65D',name:'경량 안전화',color:'GRAY',low:10,stocks:{230:6,235:11,240:15,245:22,250:28,255:35,260:38,265:41,270:34,275:25,280:14,285:8,290:4}}
];
let moves=JSON.parse(localStorage.getItem(MOVES)||'[]');
function persist(){localStorage.setItem(STORE,JSON.stringify(products));localStorage.setItem(MOVES,JSON.stringify(moves));renderAll()}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));if(id==='movement') renderMoveProducts();if(id==='history')renderHistory();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function totalOf(p){return Object.values(p.stocks).reduce((a,b)=>a+(+b||0),0)}
function renderDashboard(){
 const total=products.reduce((a,p)=>a+totalOf(p),0); const lows=products.reduce((a,p)=>a+SIZES.filter(s=>(p.stocks[s]||0)<=p.low).length,0);
 document.getElementById('totalStock').textContent=total.toLocaleString()+'족'; document.getElementById('productCount').textContent=products.length+'개'; document.getElementById('lowCount').textContent=lows+'건';
 const today=new Date().toLocaleDateString('ko-KR'); document.getElementById('todayMove').textContent=moves.filter(m=>new Date(m.date).toLocaleDateString('ko-KR')===today).length+'건';
 document.getElementById('dashboardProducts').innerHTML=products.length?`<table><thead><tr><th>모델</th><th>제품</th><th style="text-align:right">재고</th><th>상태</th></tr></thead><tbody>${products.slice(0,7).map(p=>{const low=SIZES.some(s=>(p.stocks[s]||0)<=p.low);return `<tr><td><strong>${p.model}</strong></td><td>${p.name}</td><td class="num">${totalOf(p)}족</td><td><span class="pill ${low?'low':'ok'}">${low?'확인필요':'정상'}</span></td></tr>`}).join('')}</tbody></table>`:'등록된 제품이 없습니다.';
 const r=moves.slice(0,6); document.getElementById('recentMoves').innerHTML=r.length?r.map(m=>`<div class="recent-item"><div><strong>${m.model} · ${m.size}</strong><small>${m.memo||'메모 없음'} · ${new Date(m.date).toLocaleString('ko-KR')}</small></div><div class="${m.type}">${m.type==='in'?'+':'-'}${m.qty}족</div></div>`).join(''):'아직 입출고 내역이 없습니다.';
}
function renderProducts(){const q=(document.getElementById('productSearch')?.value||'').toLowerCase();const arr=products.filter(p=>(p.model+' '+p.name+' '+p.color).toLowerCase().includes(q));document.getElementById('productList').innerHTML=`<table><thead><tr><th>모델명</th><th>제품명</th><th>색상</th><th style="text-align:right">총재고</th><th>부족 사이즈</th></tr></thead><tbody>${arr.map(p=>`<tr class="product-row" onclick="showProduct('${p.id}')"><td><strong>${p.model}</strong></td><td>${p.name}</td><td>${p.color}</td><td class="num">${totalOf(p)}족</td><td>${SIZES.filter(s=>(p.stocks[s]||0)<=p.low).length}개</td></tr>`).join('')}</tbody></table>`}
function showProduct(id){const p=products.find(x=>x.id===id);const d=document.getElementById('productDetail');d.classList.remove('hidden');d.innerHTML=`<h3 class="section-title"><span>${p.model} · ${p.name}</span><button class="btn danger" onclick="deleteProduct('${p.id}')">제품 삭제</button></h3><p class="muted">색상 ${p.color} · 부족재고 기준 ${p.low}족 이하</p><div class="size-table"><table><thead><tr>${SIZES.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody><tr>${SIZES.map(s=>`<td class="size-stock"><span class="pill ${(p.stocks[s]||0)<=p.low?'low':'ok'}">${p.stocks[s]||0}족</span></td>`).join('')}</tr></tbody></table></div>`}
function deleteProduct(id){if(confirm('이 제품을 삭제할까요?')){products=products.filter(p=>p.id!==id);document.getElementById('productDetail').classList.add('hidden');persist()}}
function openProductModal(){document.getElementById('productModal').classList.remove('hidden');document.getElementById('sizeInputs').innerHTML=SIZES.map(s=>`<div class="size-box"><span>${s}</span><input id="sz${s}" type="number" min="0" value="0"></div>`).join('')}
function closeProductModal(){document.getElementById('productModal').classList.add('hidden')}
function saveProduct(){const model=pModel.value.trim(),name=pName.value.trim();if(!model||!name){alert('모델명과 제품명을 입력해주세요.');return}const stocks={};SIZES.forEach(s=>stocks[s]=+(document.getElementById('sz'+s).value||0));products.unshift({id:crypto.randomUUID(),model,name,color:pColor.value.trim()||'-',low:+pLow.value||10,stocks});pModel.value='';pName.value='';pColor.value='';closeProductModal();persist();showView('products')}
function renderMoveProducts(){moveProduct.innerHTML=products.map(p=>`<option value="${p.id}">${p.model} · ${p.name}</option>`).join('');renderMoveSizes()}
function renderMoveSizes(){const p=products.find(x=>x.id===moveProduct.value)||products[0];moveSize.innerHTML=p?SIZES.map(s=>`<option value="${s}">${s} (현재 ${p.stocks[s]||0}족)</option>`).join(''):''}
function submitMovement(){const p=products.find(x=>x.id===moveProduct.value);if(!p){alert('제품을 먼저 등록해주세요.');return}const size=+moveSize.value,qty=+moveQty.value,type=moveType.value;if(qty<1){alert('수량을 입력해주세요.');return}const current=+(p.stocks[size]||0);if(type==='out'&&qty>current){alert(`현재 재고는 ${current}족입니다. 출고 수량을 확인해주세요.`);return}p.stocks[size]=type==='in'?current+qty:current-qty;moves.unshift({id:crypto.randomUUID(),date:new Date().toISOString(),type,productId:p.id,model:p.model,size,qty,memo:moveMemo.value.trim()});moveQty.value=1;moveMemo.value='';persist();renderMoveProducts();alert('재고에 반영했습니다.')}
function renderHistory(){document.getElementById('historyList').innerHTML=moves.length?`<table><thead><tr><th>일시</th><th>구분</th><th>모델</th><th>사이즈</th><th style="text-align:right">수량</th><th>메모</th></tr></thead><tbody>${moves.map(m=>`<tr><td>${new Date(m.date).toLocaleString('ko-KR')}</td><td><span class="pill ${m.type==='in'?'ok':'low'}">${m.type==='in'?'입고':'출고'}</span></td><td><strong>${m.model}</strong></td><td>${m.size}</td><td class="num ${m.type}">${m.type==='in'?'+':'-'}${m.qty}</td><td>${m.memo||'-'}</td></tr>`).join('')}</tbody></table>`:'내역이 없습니다.'}
function exportCSV(){const rows=[['일시','구분','모델','사이즈','수량','메모'],...moves.map(m=>[new Date(m.date).toLocaleString('ko-KR'),m.type==='in'?'입고':'출고',m.model,m.size,m.qty,m.memo||''])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='재고입출고내역.csv';a.click()}
function renderAll(){renderDashboard();renderProducts();renderHistory();}
renderAll();
</script>
</body>
</html>
