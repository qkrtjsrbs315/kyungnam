# Render 배포 설정 - https://render.com 에서 New > Blueprint 로 이 저장소를 선택하면 자동 적용
services:
  - type: web
    name: kyungnam-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL   # Neon 연결 문자열 (대시보드에서 입력)
        sync: false
      - key: FRONTEND_ORIGINS   # Vercel 주소 (쉼표 구분)
        sync: false
